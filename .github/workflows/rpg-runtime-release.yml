name: RPG Runtime Release

on:
  push:
    tags: ["retrom-core-g0a36f3762700-r*"]

permissions:
  contents: write

concurrency:
  group: rpg-runtime-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release identity
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^retrom-core-g0a36f3762700-r[1-9][0-9]*(-rc\.[1-9][0-9]*)?$ ]]
          git fetch --force origin \
            "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          test "$(git rev-list -n 1 "refs/tags/$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin \
            '+refs/heads/retrom/g0a36f3762700:refs/remotes/origin/retrom/g0a36f3762700'
          git merge-base --is-ancestor "$GITHUB_SHA" origin/retrom/g0a36f3762700
          git merge-base --is-ancestor 0a36f376270087a229bf268591582af4760607fe "$GITHUB_SHA"
          test -z "$(git rev-list --min-parents=2 0a36f376270087a229bf268591582af4760607fe.."$GITHUB_SHA")"
          python3 .github/rpg-runtime/verify-source.py
          python3 tests/test_retrom_web_host.py
      - name: Test checkpoint round trips
        run: .github/rpg-runtime/test-checkpoint.sh
      - name: Test lazy content reads
        run: bash .github/rpg-runtime/test-lazy-data.sh
      - name: Gamepad slot regression
        run: bash .github/rpg-runtime/test-gamepad.sh
      - name: Build Web assets
        run: .github/rpg-runtime/build-web.sh "$RUNNER_TEMP/rpg-runtime-output"
      - name: Validate and describe assets
        run: |
          python3 .github/rpg-runtime/verify-release.py \
            --output "$RUNNER_TEMP/rpg-runtime-output" \
            --repository "https://github.com/$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA"
      - name: Create immutable-tag release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then prerelease+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${prerelease[@]}" \
            --verify-tag --target "$GITHUB_SHA" \
            --title "Butterscotch Web $GITHUB_REF_NAME" --generate-notes \
            "$RUNNER_TEMP/rpg-runtime-output/butterscotch.mjs" \
            "$RUNNER_TEMP/rpg-runtime-output/butterscotch.wasm" \
            "$RUNNER_TEMP/rpg-runtime-output/butterscotch-meta.mjs" \
            "$RUNNER_TEMP/rpg-runtime-output/butterscotch-meta.wasm" \
            "$RUNNER_TEMP/rpg-runtime-output/LICENSE" \
            "$RUNNER_TEMP/rpg-runtime-output/rpg-runtime-release.json"
